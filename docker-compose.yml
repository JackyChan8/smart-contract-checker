services:
  redis:
      container_name: check-balance-smart-contract-redis
      image: redis
      command: ["redis-server", "--requirepass", "test-password"]
      networks:
        - default

  app:
    build: .
    container_name: check-balance-smart-contract-app
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./:/opt/app
    working_dir: /opt/app
    command: python main.py
